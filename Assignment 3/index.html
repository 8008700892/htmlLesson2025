<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Movie Poster Assignment">
    <meta name="robots" content="noindex, nofollow">
    <title>Movie Poster Assignment</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header>
    <div>
    <h1>Arrival Movie Poster Recreation</h1>
    </div>
    <nav>
<!--        links to youtube trailer and IMDB page-->
        <menu>
        <li><a href="https://youtu.be/tFMo3UJ4B4g?feature=shared" target="_blank">Trailer</a></li>
        <li><a href="https://www.imdb.com/title/tt2543164/" target="_blank">IMDB</a></li>
        </menu>
    </nav>
</header>
<main>
<!--This section has 2 columns showing the og poster and poster with no text-->
<section class="compare">
    <div>
    <h2>Original Poster</h2>
        <img src="./images/ogmovie.png" alt="og poster">
    </div>
    <div>
        <h2>Movie Poster No Text</h2>
        <img src="./images/notext.png" alt="no text poster">
    </div>
</section>
<!--This section is one column and shows the recreated movie poster-->
<section class="recreation">
    <div>
    <h2>Recreated Movie Poster</h2>
        <img src="./images/notext.png" alt="no text poster">
        <p id="actors">AMY ADAMS JEREMY RENNER FOREST WHITAKER</p>
        <p id="tag">WHY ARE THEY HERE?</p>
        <p id="director">FROM THE DIRECTOR OF SICARIO AND PRISONERS</p>
        <h3 id="title">ARRIVAL</h3>
        <p id="date">IN THEATRES II.II</p>
    </div>
</section>
</main>
</body>


</html>
